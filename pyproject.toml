[project]
name = "local-work-order-pdf-extractor"
version = "1.0.0"
description = "Local-first multilingual work-order PDF extraction with incremental JSON and CSV exports"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["pdf", "pymupdf", "regex", "data-extraction", "multilingual", "local-first"]

[tool.ruff]
line-length = 100
target-version = "py310"
